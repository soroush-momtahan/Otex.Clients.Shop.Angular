<div class="container mx-auto">
  @if (viewModel().isLoading) {
    <div class="flex justify-center items-center min-h-75">
      <p class="text-gray-500 font-semibold animate-pulse font-iran">در حال دریافت محصولات...</p>
    </div>
  }

  @else if (viewModel().hasError) {
    <div class="flex flex-col items-center justify-center min-h-75 gap-4">
      <p class="text-rose-600 font-bold font-iran">{{ viewModel().errorMessage }}</p>
      <button
        (click)="retryFetch()"
        class="px-4 py-2 bg-rose-600 text-white rounded-lg font-semibold hover:bg-rose-700 transition-colors">
        تلاش مجدد
      </button>
    </div>
  }

  @else if (viewModel().isEmpty) {
    <div class="flex justify-center items-center min-h-75 border border-dashed border-gray-300 rounded-xl">
      <p class="text-gray-500 font-semibold font-iran">محصولی برای نمایش یافت نشد.</p>
    </div>
  }

  @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-12">
      @for (product of viewModel().products; track product.id) {
        <app-product-card
          class="mx-auto w-[95%]"
          [productData]="product"
          [isCompact]="false"
        />
      }
    </div>
  }

</div>
