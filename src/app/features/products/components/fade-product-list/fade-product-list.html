<!-- کانتینر اصلی بخش پرفروش‌ترین‌ها -->
<!-- استفاده از relative برای مهار کردن هاله محوشونده -->
<section class="relative w-full py-12 md:py-24 font-sans max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" dir="rtl">

  <!-- تیتر بخش -->
  <div class="flex flex-col items-center justify-center mb-10 md:mb-16 gap-3 z-20 relative">
    <div class="w-12 h-1 bg-gradient-to-r from-transparent via-porcelain-500 to-transparent rounded-full opacity-60"></div>
    <h2 class="text-porcelain-50 font-black text-3xl md:text-5xl tracking-tight drop-shadow-md">
      پرفروش‌ترین‌های <span class="font-marjor text-transparent bg-clip-text bg-gradient-to-l from-porcelain-300 to-porcelain-500 tracking-wider">OTEX</span>
    </h2>
    <p class="text-zinc-500 text-sm md:text-base font-medium">انتخاب اول رانندگان حرفه‌ای</p>
  </div>

  <!-- کانتینر محصولات (با محدودیت ارتفاع برای اعمال افکت محو) -->
  <!-- در موبایل فقط 1.5 ردیف دیده می‌شود، در دسکتاپ 2 ردیف -->
  <div class="relative w-full max-h-[850px] md:max-h-[1100px] overflow-hidden">

    <!-- گرید محصولات -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- فرض می‌کنیم 8 محصول برتر را از سرور گرفته‌اید -->
      @for (product of getTopScrollingProducts(); track product.id) {
        <!-- کامپوننت کارت محصولی که قبلا ساختیم -->
        <div class="h-[500px]"> <!-- دادن ارتفاع ثابت به والد برای یکدستی کارت‌ها -->
          <app-product-card [productData]="product" [isCompact]="false" />
        </div>
      }
    </div>

    <!-- ============================================== -->
    <!-- هاله محوشونده (Fade-out Blur) و دکمه CTA from-[#090702] -->
    <!-- ============================================== -->
    <div class="absolute bottom-0 left-0 right-0 h-[450px] md:h-[500px]
                bg-gradient-to-t from-[#090702] via-[#090702]/90 to-transparent
                backdrop-blur-[2px] flex flex-col items-center justify-end pb-12 z-30 pointer-events-auto">

      <!-- افکت نورانی زیر دکمه برای جلب توجه (Spotlight) -->
      <div class="absolute bottom-16 w-64 h-32 bg-porcelain-500/20 blur-[60px] rounded-full pointer-events-none animate-[pulse_4s_ease-in-out_infinite]"></div>

      <!-- دکمه ورود به صفحه محصولات (Industrial & Cinematic) -->
      <a routerLink="/products"
         class="group relative inline-flex items-center gap-4 px-8 md:px-10 py-4 md:py-5
                bg-[#130e03] border border-porcelain-500/30 rounded-2xl
                hover:border-porcelain-400 hover:bg-[#1a1305]
                transition-all duration-500 ease-out hover:-translate-y-2
                shadow-[0_10px_30px_rgba(0,0,0,0.8)] hover:shadow-[0_15px_40px_rgba(233,187,73,0.2)] overflow-hidden cursor-pointer z-10 text-decoration-none">

        <!-- انیمیشن نور عبوری از روی دکمه (Shimmer Effect) -->
        <div class="absolute top-0 -left-[100%] w-1/2 h-full bg-gradient-to-r from-transparent via-porcelain-400/10 to-transparent skew-x-[-25deg] transition-all duration-700 ease-in-out group-hover:left-[200%]"></div>

        <span class="text-porcelain-100 font-bold text-lg md:text-xl tracking-wide group-hover:text-white transition-colors">
          مشاهده تمام لنت‌ها
        </span>

        <!-- آیکون فلش با انیمیشن حرکت به چپ (برای زبان فارسی RTL) -->
        <div class="w-10 h-10 bg-porcelain-500/10 rounded-xl flex items-center justify-center border border-porcelain-500/20 group-hover:bg-porcelain-500 group-hover:text-[#090702] transition-colors text-porcelain-400">
          <svg class="size-6 transition-transform duration-300 group-hover:-translate-x-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8l8 8l1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </div>
      </a>

      <!-- یک متن ریز و لوکس زیر دکمه (اعتماد سازی) -->
      <span class="mt-5 text-zinc-600 text-xs md:text-sm font-medium tracking-widest relative z-10">
        بیش از 20 مدل برای انواع خودروها
      </span>

    </div>
  </div>
</section>
