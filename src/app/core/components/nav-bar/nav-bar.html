<!-- نوار ناوبری بالا - استایل پریمیوم و صنعتی -->
<!-- توجه به کلاس‌های داینامیک اضافه شده در خطوط پایین -->
<nav class="fixed top-4 left-1/2 w-[95%] max-w-7xl rounded-full
            bg-[#201804]/70 backdrop-blur-xl border border-porcelain-500/20 shadow-[0_10px_30px_rgba(0,0,0,0.5)]
            z-50 flex items-center justify-between px-6 py-3 transition-all duration-500 ease-in-out rtl:space-x-reverse font-sans
            -translate-x-1/2"
     [class.-translate-y-[150%]]="isHidden()"
     [class.opacity-0]="isHidden()"
     [class.pointer-events-none]="isHidden()">

  @if (!navService.isSearchActive()) {
    <!-- سمت راست: بخش لوگو -->
    <div class="flex items-center gap-3 animate-fade-in">
      @if (!navService.pageTitle()) {
        <!-- لوگوی فروشگاه (رنگ طلایی و کرم) -->
        <svg class="size-10 md:size-12 text-porcelain-400 drop-shadow-[0_0_8px_rgba(233,187,73,0.4)]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
          <path d="M0 0h48v48H0z" fill="none"/>
          <defs>
            <mask id="SVGPfAb1cWI">
              <g fill="" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
                <path fill="" d="M24 40c8.837 0 16-7.163 16-16S32.837 8 24 8S8 15.163 8 24s7.163 16 16 16"/>
                <path fill="#555" d="M24 28a4 4 0 1 0 0-8a4 4 0 0 0 0 8m0-24a20 20 0 0 1 20 20h-7.994A12.006 12.006 0 0 0 24 11.994z"/>
              </g>
            </mask>
          </defs>
          <path fill="currentColor" d="M0 0h48v48H0z" mask="url(#SVGPfAb1cWI)"/>
        </svg>
        <div class="w-full font-bold items-center flex text-porcelain-100 text-xl md:text-2xl gap-1.5 tracking-tight">
          <span class="font-extrabold text-porcelain-50">لنت</span>
          <!-- فونت انگلیسی اختصاصی برای OTEX -->
          <span class="font-marjor relative top-[-2px] text-transparent bg-clip-text bg-gradient-to-r from-porcelain-300 to-porcelain-500 tracking-wider">OTEX</span>
        </div>
      } @else {
        <!-- حالت اختصاصی: نام و آیکون صفحه -->
        @if (navService.pageIcon(); as iconTpl) {
          <ng-container *ngTemplateOutlet="iconTpl"></ng-container>
        }
        @if (navService.pageTitle(); as pageTitle) {
          <ng-container *ngTemplateOutlet="pageTitle"></ng-container>
        }
      }
    </div>

    <!-- لینک‌های وسط (Desktop) -->
    <div class="hidden md:flex items-center gap-8 text-sm font-medium text-porcelain-100/70">
      <a [routerLink]="['/home']" routerLinkActive="text-porcelain-400 drop-shadow-[0_0_8px_rgba(233,187,73,0.5)]" class="hover:text-porcelain-300 transition-all duration-300">خانه</a>
      <a [routerLink]="['/products']" routerLinkActive="text-porcelain-400 drop-shadow-[0_0_8px_rgba(233,187,73,0.5)]" class="hover:text-porcelain-300 transition-all duration-300">محصولات</a>
      <a href="#" class="hover:text-porcelain-300 transition-all duration-300">لیست قیمت</a>
      <a href="#" class="hover:text-porcelain-300 transition-all duration-300">تماس با ما</a>
    </div>

    <!-- سمت چپ: اکشن‌ها -->
    <div class="flex items-center gap-3">
      @if (navService.pageActions(); as actionsTpl) {
        <div class="flex items-center gap-2 border-l border-porcelain-500/20 ml-2 pl-2">
          <ng-container *ngTemplateOutlet="actionsTpl"></ng-container>
        </div>
      }
      <app-currency-changer-icon class="md:me-2 text-porcelain-200 hover:text-porcelain-400 transition-colors"/>

      <!-- سبد خرید -->
      <button class="hidden md:block relative p-2 text-porcelain-200 hover:text-porcelain-400 transition-all duration-300 hover:scale-110">
        <svg class="size-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none"/>
          <path fill="currentColor" d="M18 20H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2z" opacity=".1"/>
          <path fill="currentColor" d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2m-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2m6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2z"/>
        </svg>
        <span class="absolute top-1 right-1 bg-gradient-to-br from-porcelain-400 to-porcelain-600 text-[#201804] font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center shadow-lg">۲</span>
      </button>

      <!-- پروفایل -->
      <button class="hidden md:block p-2 text-porcelain-200 hover:text-porcelain-400 transition-all duration-300 hover:scale-110">
        <svg class="size-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none"/>
          <g fill="none">
            <path fill="currentColor" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2" opacity=".1"/>
            <path stroke="currentColor" stroke-linejoin="round" stroke-width="2" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
            <circle cx="12" cy="7" r="3" stroke="currentColor" stroke-width="2"/>
          </g>
        </svg>
      </button>
    </div>

  } @else {
    <!-- حالت جستجو (فعال) -->
    <div class="flex items-center justify-between w-full h-full gap-3 animate-fade-in-fast">
      <svg class="text-porcelain-400 size-7 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none"/>
        <g fill="none">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m21 21l-4.343-4.343m0 0A8 8 0 1 0 5.343 5.343a8 8 0 0 0 11.314 11.314"/>
        </g>
      </svg>

      <input #searchInput
             [ngModel]="navService.searchBarQuery()"
             (ngModelChange)="navService.searchBarQuery.set($event)"
             type="text"
             placeholder="جستجوی کد لنت، ماشین یا برند..."
             class="flex-1 bg-transparent border-none outline-none text-base md:text-lg text-porcelain-50 placeholder-porcelain-300/40 w-full px-2"
             autocomplete="off">

      <div class="flex items-center gap-2 shrink-0 border-r border-porcelain-500/30 pr-3">
        <button class="p-2 text-porcelain-200 hover:text-porcelain-400 bg-white/5 hover:bg-white/10 rounded-full transition-all">
          <svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18M6 12h12m-9 6h6"/>
          </svg>
        </button>

        <button (click)="closeSearch()" class="p-2 text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 rounded-full transition-all">
          <svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  }
</nav>
