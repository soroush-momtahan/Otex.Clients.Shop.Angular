<section class="relative w-full py-24 bg-[#181203] font-sans overflow-hidden" dir="rtl">

  <!-- افکت نوری پس‌زمینه (استایل صنعتی) -->
  <div class="absolute top-1/2 left-0 -translate-y-1/2 w-[600px] h-[600px] bg-porcelain-700/5 blur-[120px] rounded-full pointer-events-none"></div>

  <div class="container mx-auto px-6 max-w-5xl relative z-10">

    <!-- هدر بخش FAQ -->
    <div class="text-center md:text-right mb-16">
      <div class="inline-flex items-center gap-2 px-3 py-1.5 mb-4 rounded-full bg-white/5 border border-porcelain-500/20 shadow-[0_0_10px_rgba(227,171,28,0.05)]">
        <div class="w-2 h-2 bg-porcelain-500 rounded-full animate-pulse"></div>
        <span class="text-porcelain-400 text-sm font-bold tracking-widest">پشتیبانی و اطلاعات</span>
      </div>
      <h2 class="text-3xl md:text-5xl font-black text-white leading-tight">
        پاسخ به سوالات <span class="text-transparent bg-clip-text bg-gradient-to-l from-porcelain-300 to-porcelain-500">متداول شما</span>
      </h2>
      <p class="mt-4 text-porcelain-200/60 text-lg md:text-xl">
        شفافیت در خدمات، اطمینان در خرید. هر آنچه باید درباره اُتکس بدانید.
      </p>
    </div>

    <!-- لیست کرکره‌ای (Accordion) -->
    <div class="flex flex-col gap-4">

      @for (faq of faqs; track $index) {
        <div class="group relative rounded-2xl bg-[#201804]/60 backdrop-blur-sm border transition-all duration-300 overflow-hidden cursor-pointer"
             [class.border-porcelain-500/40]="activeFaq() === $index"
          [class.border-porcelain-500/10]="activeFaq() !== $index"
          [class.shadow-[0_5px_30px_rgba(227,171,28,0.1)]]="activeFaq() === $index"
          (click)="toggleFaq($index)">

          <!-- خط نوری ظریف در سمت راست وقتی آیتم فعال است -->
        <div class="absolute right-0 top-0 bottom-0 w-1 bg-gradient-to-b from-porcelain-400 to-porcelain-600 transition-transform duration-300 origin-top"
             [class.scale-y-100]="activeFaq() === $index"
             [class.scale-y-0]="activeFaq() !== $index">
        </div>

        <!-- دکمه/تیتر سوال -->
        <div class="flex items-center justify-between p-6 md:px-8 md:py-6">
          <h3 class="text-lg md:text-xl font-bold transition-colors duration-300 pl-4"
              [class.text-white]="activeFaq() === $index"
              [class.text-porcelain-100]="activeFaq() !== $index">
            {{ faq.question }}
          </h3>

          <!-- آیکون پلاس / ماینوس (طراحی مکانیکی) -->
          <div class="relative shrink-0 w-10 h-10 rounded-full flex items-center justify-center transition-colors duration-300"
               [class.bg-porcelain-500/10]="activeFaq() === $index"
          [class.bg-white/5]="activeFaq() !== $index">

          <!-- خط افقی (همیشه هست) -->
          <div class="absolute w-4 h-0.5 rounded-full transition-colors duration-300"
               [class.bg-porcelain-400]="activeFaq() === $index"
               [class.bg-porcelain-300]="activeFaq() !== $index"></div>

          <!-- خط عمودی (وقتی باز میشه میچرخه و محو میشه) -->
          <div class="absolute w-4 h-0.5 rounded-full bg-porcelain-300 transition-transform duration-300 ease-in-out"
               [class.rotate-90]="activeFaq() !== $index"
               [class.rotate-0]="activeFaq() === $index"
               [class.opacity-0]="activeFaq() === $index"
               [class.opacity-100]="activeFaq() !== $index"></div>
        </div>
        </div>

        <!-- بدنه پاسخ (با انیمیشن Grid روان) -->
          <!-- استفاده از grid-template-rows برای انیمیشن ارتفاع -->
        <div class="grid transition-all duration-[400ms] ease-in-out px-6 md:px-8"
             [style.grid-template-rows]="activeFaq() === $index ? '1fr' : '0fr'">
          <div class="overflow-hidden">
            <!-- پدینگ پایین در اینجا قرار می‌گیرد تا در حالت بسته دیده نشود -->
            <p class="pb-6 md:pb-8 text-porcelain-200/80 text-base md:text-lg leading-relaxed text-justify"
               [innerHTML]="faq.answer"></p>
          </div>
        </div>

        </div>
      }

    </div>
  </div>
</section>
