<!--
  توضیح کلاس های اصلی:
  backdrop-blur-2xl: تار کردن شدید پس زمینه (مثل iOS)
  bg-white/50: سفیدی با 50 درصد شفافیت (برای دارک مود میتونی dark:bg-black/50 بذاری)
  pb-[calc(env(safe-area-inset-bottom)+10px)]: جلوگیری از رفتن زیر خط آیفون
-->
<nav class="fixed bottom-0 left-0 right-0 z-40
            bg-white/50 backdrop-blur-2xl
            border-t border-white/60 shadow-[0_-4px_30px_rgba(0,0,0,0.05)]
            px-4 pt-3 pb-[calc(env(safe-area-inset-bottom)+12px)]">

  <div class="flex justify-around items-center max-w-md mx-auto">

    <!-- استفاده از سینتکس جدید Control Flow در انگولار -->
    @for (item of navItems(); track item.id) {
      <button
        (click)="checkLoginAndSetActiveAndNavigate(item.id)"
        class="relative flex flex-col items-center justify-center w-16 gap-1
               transition-all duration-300 ease-out tap-highlight-transparent"
        [class.text-porcelain-600]="activeTab() === item.id"
        [class.text-gray-400]="activeTab() !== item.id">

        <!-- افکت پس زمینه برای آیکون فعال (اختیاری ولی زیبا) -->
        @if (activeTab() === item.id) {
          <div class="absolute inset-0 bg-porcelain-100/50 rounded-xl -z-10 scale-125 transition-transform"></div>
        }

        <!-- آیکون (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-6 h-6 transition-transform duration-300"
             [class.scale-110]="activeTab() === item.id"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>

        <!-- متن لیبل -->
        <span class="text-2xs font-bold tracking-wide transition-all"
              [class.opacity-100]="activeTab() === item.id"
              [class.opacity-70]="activeTab() !== item.id">
          {{ item.label }}
        </span>
      </button>
    }
  </div>
</nav>

<!--
  نکته مهم: برای اینکه محتوای اصلی سایت شما (مثلاً لیست محصولات)
  زیر این نویگیشن شیشه ای گیر نکند، باید به انتهای صفحه اصلی خود پدینگ بدهید:
  مثلا: <main class="pb-24">...</main>
-->
