<nav class="fixed bottom-0 left-0 right-0 z-40
            bg-white/50 backdrop-blur-2xl
            border-t border-white/60 shadow-[0_-4px_30px_rgba(0,0,0,0.05)]
            px-4 pt-3 pb-[calc(env(safe-area-inset-bottom)+12px)]">

  <div class="flex justify-around items-center max-w-md mx-auto">

    @for (item of navItems(); track item.id) {
      <button
        (click)="checkLoginAndSetActiveAndNavigate(item.id)"
        class="relative flex flex-col items-center justify-center w-16 gap-1
               transition-all duration-300 ease-out tap-highlight-transparent"
        [class.text-porcelain-600]="activeTab() === item.id"
        [class.text-gray-400]="activeTab() !== item.id">

        @if (activeTab() === item.id) {
          <div class="absolute inset-0 bg-porcelain-100/50 rounded-xl -z-10 scale-125 transition-transform"></div>
        }

        <!-- رندر کردن SVG اختصاصی بر اساس شناسه -->
        @switch (item.id) {
          
          <!-- آیکون خانه -->
          @case ('home') {
            <svg class="w-6 h-6 transition-transform duration-300" [class.scale-110]="activeTab() === item.id" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <g fill="currentColor">
                <path d="M17 21H7a2 2 0 0 1-2-2v-9l7-7l7 7v9a2 2 0 0 1-2 2" opacity=".16" />
                <path d="M20 10a1 1 0 1 0-2 0zM6 10a1 1 0 0 0-2 0zm14.293 2.707a1 1 0 0 0 1.414-1.414zM12 3l.707-.707a1 1 0 0 0-1.414 0zm-9.707 8.293a1 1 0 1 0 1.414 1.414zM7 22h10v-2H7zm13-3v-9h-2v9zM6 19v-9H4v9zm15.707-7.707l-9-9l-1.414 1.414l9 9zm-10.414-9l-9 9l1.414 1.414l9-9zM17 22a3 3 0 0 0 3-3h-2a1 1 0 0 1-1 1zM7 20a1 1 0 0 1-1-1H4a3 3 0 0 0 3 3z" />
              </g>
            </svg>
          }

          <!-- آیکون محصولات -->
          @case ('products') {
            <svg class="w-6 h-6 transition-transform duration-300" [class.scale-110]="activeTab() === item.id" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="currentColor" d="M3 20.5q-.425 0-.712-.288T2 19.5v-6q0-.425.288-.712T3 12.5h6q.425 0 .713.288T10 13.5v6q0 .425-.288.713T9 20.5zm1-2h4v-4H4zM14.725 10h-7.45q-.575 0-.862-.513t.012-1.012L10.15 2.4q.3-.5.85-.5t.85.5l3.725 6.075q.3.5.013 1.013t-.863.512M9.05 8h3.9L11 4.85zm11.825 14.25l-1.95-1.95q-.525.35-1.137.525T16.5 21q-1.875 0-3.187-1.312T12 16.5t1.313-3.187T16.5 12t3.188 1.313T21 16.5q0 .65-.175 1.263t-.5 1.137l1.95 1.95q.275.275.275.7t-.275.7t-.7.275t-.7-.275m-2.6-3.975Q19 17.55 19 16.5t-.725-1.775T16.5 14t-1.775.725T14 16.5t.725 1.775T16.5 19t1.775-.725M11 8" />
            </svg>
          }

          <!-- آیکون کیف‌پول -->
          @case ('wallet') {
            <svg class="w-6 h-6 transition-transform duration-300" [class.scale-110]="activeTab() === item.id" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="currentColor" d="M18 4H6C3.79 4 2 5.79 2 8v8c0 2.21 1.79 4 4 4h12c2.21 0 4-1.79 4-4V8c0-2.21-1.79-4-4-4m-1.86 9.77c-.24.2-.57.28-.88.2L4.15 11.25C4.45 10.52 5.16 10 6 10h12c.67 0 1.26.34 1.63.84zM6 6h12c1.1 0 2 .9 2 2v.55c-.59-.34-1.27-.55-2-.55H6c-.73 0-1.41.21-2 .55V8c0-1.1.9-2 2-2" />
            </svg>
          }

          <!-- آیکون سبد خرید -->
          @case ('cart') {
            <svg class="w-6 h-6 transition-transform duration-300" [class.scale-110]="activeTab() === item.id" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="currentColor" d="M18 20H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2z" opacity=".3" />
              <path fill="currentColor" d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2m-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2m6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2z" />
            </svg>
          }

          <!-- آیکون پروفایل -->
          @case ('profile') {
            <svg class="w-6 h-6 transition-transform duration-300" [class.scale-110]="activeTab() === item.id" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <g fill="none">
                <path fill="currentColor" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2" opacity=".16" />
                <path stroke="currentColor" stroke-linejoin="round" stroke-width="2" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
                <circle cx="12" cy="7" r="3" stroke="currentColor" stroke-width="2" />
              </g>
            </svg>
          }
        }

        <span class="text-2xs font-bold tracking-wide transition-all"
              [class.opacity-100]="activeTab() === item.id"
              [class.opacity-70]="activeTab() !== item.id">
          {{ item.label }}
        </span>
      </button>
    }
  </div>
</nav>
