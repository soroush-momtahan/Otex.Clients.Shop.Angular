@if (isLoading()) {
  <!-- پس‌زمینه لودر: تاریک‌تر، با بلور بسیار بالا برای حس سینمایی -->
  <div class="fixed inset-0 z-[9999] flex items-center justify-center
            bg-[#0a0801]/90 backdrop-blur-2xl
            transition-all duration-700 ease-out" dir="ltr">

    <!-- باکس اصلی: طراحی شده شبیه به یک صفحه نمایشگر قطعات (Dashboard) -->
    <div class="relative flex flex-col items-center justify-center px-16 py-10
              bg-gradient-to-b from-[#201804]/90 to-[#120e02]/95 rounded-2xl
              border border-porcelain-500/15 shadow-[0_20px_60px_rgba(0,0,0,0.8)]
              overflow-hidden isolate">

      <!-- هاله نوری محو در بک‌گراند باکس که به آرامی می‌تپد -->
      <div class="absolute inset-0 bg-porcelain-500/5 blur-[60px] animate-ambient-glow"></div>

      <!-- کانتینر اصلی تایپوگرافی -->
      <div class="relative z-10 flex items-center gap-0.5 text-6xl md:text-7xl font-marjor font-black drop-shadow-2xl">

        <!-- حروف OTE با افکت بازتاب نور روی فلز (Shimmer Effect) -->
        <span class="tracking-widest bg-clip-text text-transparent
                   bg-gradient-to-r from-porcelain-700 via-porcelain-200 to-porcelain-700
                   bg-[length:200%_auto] animate-metal-shine">
        OTE
      </span>

        <!-- حرف X (ساعت شنی) با افکت چرخش مکانیکی و درخشش طلایی -->
        <span class="inline-block text-porcelain-400 drop-shadow-[0_0_20px_rgba(227,171,28,0.7)] animate-mechanical-flip origin-center">
        X
      </span>

      </div>

      <!-- خط پردازشگر زیرین (Indeterminate Progress Bar) -->
      <!-- این خط به جای هاور، دائما حس "در حال بارگذاری اطلاعات" را القا میکند -->
      <div class="absolute bottom-0 left-0 w-full h-[2px] bg-[#120e02] overflow-hidden">
        <div class="h-full bg-gradient-to-r from-transparent via-porcelain-400 to-transparent w-1/2 animate-scan-line"></div>
      </div>

    </div>
  </div>
}
