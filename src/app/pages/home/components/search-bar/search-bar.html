<div class="w-full">
  <div class="animated-border-porcelain"
       [class.animated-border-porcelain-focus]="isFocused()">
    <!-- لایه داخلی شیشه‌ای -->
    <div class="flex items-center bg-white/30 backdrop-blur-[1px] border-porcelain-400/30 shadow-[0_8px_30px_rgb(0,0,0,0.04)] gap-2 border-1.5
                    rounded-[10px] px-4 py-2.5">

      <!-- آیکون جستجو -->
      <svg class="w-5 h-5 text-porcelain-600 shrink-0"
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>

      <!-- اینپوت -->
      <input
        type="text"
        [placeholder]="placeholder()"
        [(ngModel)]="inputValue"
        (focus)="isFocused.set(true)"
        (blur)="isFocused.set(false)"
        class="flex-1 bg-transparent font-medium outline-none text-sm
                   text-porcelain-900 placeholder:text-porcelain-600"
      />

      <!-- دکمه پاک کردن (اختیاری) -->
      @if (inputValue(); as val) {
        @if (val.length > 0) {
          <button (click)="clear()"
                  class="text-porcelain-400 hover:text-porcelain-700
                             transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        }
      }
    </div>
  </div>
</div>
