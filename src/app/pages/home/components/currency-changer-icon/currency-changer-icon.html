<button
  (click)="toggleCurrency()"
  class="relative group cursor-pointer transition-all duration-300 hover:scale-105 active:scale-95"
  [class.animate-flip-out]="isAnimating"

  <!-- Container با perspective برای افکت 3D -->

        <!-- حلقه بیرونی با انیمیشن pulse -->

          cx="16"
          cy="16"
          r="12"
          fill="currentColor"
          opacity="0.2"
          class="relative animate-pulse-glow"

          fill="currentColor"

          class="transition-all duration-300 group-hover:stroke-2"
