<div class="min-h-screen" dir="rtl">
  <app-hero-section/>

  <!-- کادر اصلی محتوا -->
  <div class="relative z-10 -mt-20 md:-mt-32 px-4 md:px-0 max-w-6xl mx-auto mb-20">
    <div class="bg-white/70 backdrop-blur-xl border border-white/50 shadow-2xl rounded-3xl p-6 md:p-10">

      <!-- Success Message -->
      @if (isSubmitted()) {
        <app-submitted-cooperation/>
      }
      @else {

        <div class="flex flex-col md:flex-row gap-10">

          <!-- Sidebar (فقط در دسکتاپ) - بدون تغییر نسبت به کدهای شما -->
          @if (isDesktop()) {
            <div class="flex flex-col justify-around w-full md:w-1/3 bg-porcelain-100/50 rounded-2xl p-6 border border-porcelain-200">
              <app-cooperation-benefits/>
            </div>

          }
          <!-- Form Area -->
          <div class="w-full md:w-2/3">
            <app-cooperation-form [isDesktop] = "isDesktop()" (formSubmittedEvent)="isSubmitted.set($event)"/>
          </div>
        </div>
      }
    </div>
  </div>
</div>
