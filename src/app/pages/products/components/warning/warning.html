<!-- باکس هشدار مهندسی و صنعتی -->
<!-- کلاس animate-slide-up-fade باعث می‌شود باکس با انیمیشن وارد صفحه شود -->
<div class="relative w-full max-w-4xl mx-auto rounded-2xl overflow-hidden bg-[#151108] border border-amber-500/20 shadow-[0_10px_40px_rgba(245,158,11,0.05)] transition-all duration-500 hover:shadow-[0_10px_50px_rgba(245,158,11,0.1)] hover:border-amber-500/40 group font-sans" dir="rtl">

  <!-- افکت نوری پس‌زمینه (Glow) که در تاریکی میدرخشد -->
  <div class="absolute -top-24 -right-24 w-64 h-64 bg-amber-500/10 blur-[80px] rounded-full pointer-events-none transition-all duration-700 group-hover:bg-amber-500/20"></div>

  <div class="relative flex flex-col md:flex-row items-start md:items-center p-5 md:p-6 gap-5 md:gap-6">

    <!-- نوار متحرک هشدار (Industrial Hazard Bar) در سمت راست -->
    <div class="absolute top-0 right-0 bottom-0 w-1.5 bg-amber-500">
      <!-- استفاده از پس‌زمینه راه‌راه (Stripes) متحرک با CSS سفارشی -->
      <div class="w-full h-full opacity-50 hazard-stripes animate-stripes-move"></div>
    </div>

    <!-- آیکون هشدار با افکت پالس (Radar Pulse) -->
    <div class="relative flex-shrink-0 ml-2 mt-1 md:mt-0">
      <!-- هاله‌های تپنده پشت آیکون -->
      <div class="absolute inset-0 bg-amber-500/30 rounded-full blur-md animate-ping"></div>
      <div class="absolute inset-0 bg-amber-500/20 rounded-full blur-xl animate-[pulse_2s_infinite]"></div>

      <!-- خود آیکون -->
      <div class="relative z-10 w-12 h-12 bg-gradient-to-br from-[#201804] to-[#090702] border border-amber-500/50 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(245,158,11,0.2)] group-hover:scale-110 transition-transform duration-500">
        <svg class="w-7 h-7 text-amber-500 drop-shadow-[0_0_5px_rgba(245,158,11,0.8)]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 16h2v2h-2zm0-6h2v5h-2z"/>
        </svg>
      </div>
    </div>

    <!-- محتوای متنی (کوتاه، بولد، با کنتراست بالا) -->
    <div class="flex-1 flex flex-col gap-2">
      <h3 class="text-amber-500 text-lg md:text-xl font-black tracking-wide flex items-center gap-2">
        هشدار تطابق فنی قطعات
        <!-- یک بج کوچک برای جلب توجه بیشتر -->
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 animate-pulse">
          مهم
        </span>
      </h3>

      <p class="text-white text-base font-bold leading-relaxed">
        نام لنت لزوماً با نام خودروی شما یکی نیست!
      </p>

      <p class="text-gray-400 text-sm md:text-base leading-relaxed font-medium">
        گاهی خودروسازان از سیستم ترمز ماشین‌های دیگر <span class="text-gray-300 font-bold bg-white/5 px-1 rounded">(مثلاً لنت رانا برای سمند)</span> استفاده می‌کنند. برای اطمینان ۱۰۰٪، پیش از خرید، ظاهر لنت فعلی خودرو را چک کنید یا با مکانیک خود مشورت نمایید.
      </p>
    </div>

  </div>
</div>
